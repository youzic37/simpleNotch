name: Reusable simpleNotch Preview Build

on:
  workflow_call:
    inputs:
      head_ref:
        description: Git ref to build
        required: false
        type: string
        default: main
      version:
        description: Numeric marketing version override
        required: false
        type: string
      build_number:
        description: Numeric build number override
        required: false
        type: string

jobs:
  build:
    name: Build ad-hoc preview
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      PROJECT_NAME: boringNotch
      APP_NAME: simpleNotch
      VERSION_INPUT: ${{ inputs.version }}
      BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.head_ref }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "${PROJECT_NAME}.xcodeproj"

      - name: Build ad-hoc preview
        shell: bash
        run: |
          set -euo pipefail

          BUILD_NUMBER="${BUILD_NUMBER_INPUT:-$GITHUB_RUN_NUMBER}"
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || {
            echo "::error::Build number must be numeric"
            exit 1
          }
          if [[ -n "$VERSION_INPUT" && ! "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match X.Y.Z"
            exit 1
          fi
          BUILD_ARGS=(
            clean build
            -project "${PROJECT_NAME}.xcodeproj"
            -scheme "${PROJECT_NAME}"
            -configuration Release
            -destination "generic/platform=macOS"
            -derivedDataPath "$RUNNER_TEMP/DerivedData"
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_IDENTITY=-
            DEVELOPMENT_TEAM=
            CODE_SIGNING_ALLOWED=YES
            CODE_SIGNING_REQUIRED=YES
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
            ENABLE_HARDENED_RUNTIME=NO
            ONLY_ACTIVE_ARCH=NO
          )

          if [[ -n "$VERSION_INPUT" ]]; then
            BUILD_ARGS+=(MARKETING_VERSION="$VERSION_INPUT")
          fi

          xcodebuild "${BUILD_ARGS[@]}"

          BUILT_APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/${APP_NAME}.app"
          test -d "$BUILT_APP"
          mkdir -p Release
          test ! -e "Release/${APP_NAME}.app"
          ditto "$BUILT_APP" "Release/${APP_NAME}.app"

      - name: Verify preview signature and identity
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="Release/${APP_NAME}.app"
          EXPECTED_BUILD_NUMBER="${BUILD_NUMBER_INPUT:-$GITHUB_RUN_NUMBER}"
          codesign --verify --deep --strict "$APP_PATH"
          SIGNATURE_INFO="$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)"
          printf '%s\n' "$SIGNATURE_INFO"
          grep -q '^Signature=adhoc$' <<<"$SIGNATURE_INFO"
          if grep -q '^Authority=' <<<"$SIGNATURE_INFO"; then
            echo "::error::Preview workflow must not claim a Developer ID identity"
            exit 1
          fi

          test "$(defaults read "$PWD/$APP_PATH/Contents/Info" CFBundleDisplayName)" = "$APP_NAME"
          test "$(defaults read "$PWD/$APP_PATH/Contents/Info" CFBundleIdentifier)" = "com.github.wutao-maker.simpleNotch"
          test "$(defaults read "$PWD/$APP_PATH/Contents/Info" CFBundleVersion)" = "$EXPECTED_BUILD_NUMBER"
          if [[ -n "$VERSION_INPUT" ]]; then
            test "$(defaults read "$PWD/$APP_PATH/Contents/Info" CFBundleShortVersionString)" = "$VERSION_INPUT"
          fi

          MACH_O_COUNT=0
          while IFS= read -r CANDIDATE; do
            if file "$CANDIDATE" | grep -q 'Mach-O'; then
              MACH_O_COUNT=$((MACH_O_COUNT + 1))
              ARCHITECTURES="$(lipo -archs "$CANDIDATE")"
              printf '%s: %s\n' "$CANDIDATE" "$ARCHITECTURES"
              [[ " $ARCHITECTURES " == *" arm64 "* ]]
              [[ " $ARCHITECTURES " == *" x86_64 "* ]]
            fi
          done < <(find "$APP_PATH" -type f -perm -111 -print)
          test "$MACH_O_COUNT" -gt 0

      - name: Install hash-pinned DMG dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dmg-venv"
          source "$RUNNER_TEMP/dmg-venv/bin/activate"
          python3 -m pip install --require-hashes -r Configuration/dmg/requirements.txt

      - name: Create and verify DMG
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/dmg-venv/bin/activate"
          PACKAGE_LICENSES_DIR="Release/Swift Package Licenses"
          mkdir -p "$PACKAGE_LICENSES_DIR"
          while IFS= read -r LICENSE_FILE; do
            PACKAGE_NAME="$(basename "$(dirname "$LICENSE_FILE")")"
            cp "$LICENSE_FILE" "$PACKAGE_LICENSES_DIR/${PACKAGE_NAME}-LICENSE.txt"
          done < <(
            find "$RUNNER_TEMP/DerivedData/SourcePackages/checkouts" \
              -maxdepth 2 -type f \
              \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) \
              -print
          )
          test "$(find "$PACKAGE_LICENSES_DIR" -type f | wc -l | tr -d ' ')" -ge 10

          chmod +x Configuration/dmg/create_dmg.sh
          ./Configuration/dmg/create_dmg.sh \
            "Release/${APP_NAME}.app" \
            "Release/${APP_NAME}.dmg" \
            "${APP_NAME} Preview" \
            "$PACKAGE_LICENSES_DIR"
          hdiutil verify "Release/${APP_NAME}.dmg"
          (
            cd Release
            shasum -a 256 "${APP_NAME}.dmg" > "${APP_NAME}.dmg.sha256"
          )

      - name: Upload preview DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simpleNotch.dmg
          path: |
            Release/simpleNotch.dmg
            Release/simpleNotch.dmg.sha256
          if-no-files-found: error

      - name: Upload preview app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simpleNotch.app
          path: Release/simpleNotch.app
          if-no-files-found: error
