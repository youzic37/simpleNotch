name: Manual simpleNotch Preview Build

on:
  workflow_dispatch:
    inputs:
      head_ref:
        description: Branch or commit to build
        required: false
        default: main
      version:
        description: Numeric marketing version override (optional)
        required: false
      build_number:
        description: Numeric build number override (optional)
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build simpleNotch.app
    uses: ./.github/workflows/build_reusable.yml
    with:
      head_ref: ${{ inputs.head_ref || 'main' }}
      version: ${{ inputs.version || '' }}
      build_number: ${{ inputs.build_number || '' }}
