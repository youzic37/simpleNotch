name: Publish simpleNotch Preview

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Preview tag, for example v0.1.0-preview.1
        required: true
      version:
        description: Numeric app version, for example 0.1.0
        required: true
      head_ref:
        description: Branch or commit to release
        required: false
        default: main
      build_number:
        description: Numeric build number override (optional)
        required: false

concurrency:
  group: simpleNotch-preview-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Pin source commit
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_ref || 'main' }}

      - name: Validate version, tag, and source
        id: source
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Version must match X.Y.Z"
            exit 1
          }
          [[ "$TAG" == "v${VERSION}-preview."* ]] || {
            echo "::error::Tag must match v${VERSION}-preview.N"
            exit 1
          }
          PREVIEW_NUMBER="${TAG#v${VERSION}-preview.}"
          [[ "$PREVIEW_NUMBER" =~ ^[0-9]+$ ]] || {
            echo "::error::Preview number must be numeric"
            exit 1
          }

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          else
            STATUS=$?
            if [[ "$STATUS" -ne 2 ]]; then
              echo "::error::Could not check whether tag $TAG exists"
              exit "$STATUS"
            fi
          fi

          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build simpleNotch.app
    needs: validate
    uses: ./.github/workflows/build_reusable.yml
    with:
      head_ref: ${{ needs.validate.outputs.commit_sha }}
      version: ${{ inputs.version }}
      build_number: ${{ inputs.build_number || '' }}

  publish:
    name: Publish unnotarized prerelease
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: simpleNotch.dmg
          path: Release

      - name: Validate release input and assets
        shell: bash
        run: |
          set -euo pipefail
          test -f Release/simpleNotch.dmg
          test -f Release/simpleNotch.dmg.sha256
          (
            cd Release
            shasum -a 256 -c simpleNotch.dmg.sha256
          )

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ needs.validate.outputs.commit_sha }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi

          if TAG_CHECK="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>&1)"; then
            echo "::error::Tag $TAG was created while this workflow was running"
            exit 1
          else
            TAG_STATUS=$?
            if [[ "$TAG_STATUS" -ne 1 || "$TAG_CHECK" != *"HTTP 404"* ]]; then
              printf '%s\n' "$TAG_CHECK"
              echo "::error::Could not safely confirm that tag $TAG is unused"
              exit 1
            fi
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="$TARGET" \
            --silent

          NOTES_FILE="$RUNNER_TEMP/simpleNotch-release-notes.md"
          {
            echo "## Distribution notice"
            echo
            echo "This is a preview build. It is ad-hoc signed and has not been notarized by Apple."
            echo "macOS may block the first launch; use System Settings > Privacy & Security > Open Anyway if you trust this repository and build."
            echo
            echo "The downloadable application inside the DMG is named \`simpleNotch.app\`."
          } > "$NOTES_FILE"

          gh release create "$TAG" \
            Release/simpleNotch.dmg \
            Release/simpleNotch.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG — simpleNotch Preview" \
            --notes-file "$NOTES_FILE" \
            --verify-tag \
            --prerelease
